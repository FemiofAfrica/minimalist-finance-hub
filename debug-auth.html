<!DOCTYPE html>
<html>
<head>
    <title>Auth Debug</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Authentication Debug</h1>
    <button id="testAuth">Test Auth</button>
    <button id="testFunction">Test Function Call</button>
    <div id="results"></div>

    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(
            'https://idcgvnwatraddbsppxzl.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkY2d2bndhdHJhZGRic3BweHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ3OTU5NjIsImV4cCI6MjA1MDM3MTk2Mn0.Kj-MZqmOaErlH23DGbFZMVUbFYMGOvKFjcUusDGb6Hk'
        );

        document.getElementById('testAuth').addEventListener('click', async () => {
            const results = document.getElementById('results');
            
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                console.log('Session:', session);
                console.log('Error:', error);
                
                if (session) {
                    results.innerHTML = `
                        <h3>Session Info:</h3>
                        <p><strong>User ID:</strong> ${session.user.id}</p>
                        <p><strong>Email:</strong> ${session.user.email}</p>
                        <p><strong>Access Token (first 50 chars):</strong> ${session.access_token.substring(0, 50)}...</p>
                        <p><strong>User Metadata:</strong> ${JSON.stringify(session.user.user_metadata, null, 2)}</p>
                        <p><strong>Raw User Meta Data:</strong> ${JSON.stringify(session.user.raw_user_meta_data, null, 2)}</p>
                        <p><strong>App Metadata:</strong> ${JSON.stringify(session.user.app_metadata, null, 2)}</p>
                        <p><strong>Raw App Meta Data:</strong> ${JSON.stringify(session.user.raw_app_meta_data, null, 2)}</p>
                    `;
                } else {
                    results.innerHTML = '<p>No active session</p>';
                }
            } catch (err) {
                results.innerHTML = `<p>Error: ${err.message}</p>`;
                console.error(err);
            }
        });

        document.getElementById('testFunction').addEventListener('click', async () => {
            const results = document.getElementById('results');
            
            try {
                console.log('Testing function call...');
                
                const { data, error } = await supabaseClient.functions.invoke('send-push-notification', {
                    body: {
                        title: 'Test',
                        message: 'Test message',
                        targetType: 'segment',
                        segment: 'super_admins'
                    }
                });
                
                console.log('Function result:', { data, error });
                
                if (error) {
                    results.innerHTML = `<p>Function Error: ${JSON.stringify(error, null, 2)}</p>`;
                } else {
                    results.innerHTML = `<p>Function Success: ${JSON.stringify(data, null, 2)}</p>`;
                }
            } catch (err) {
                results.innerHTML = `<p>Exception: ${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
