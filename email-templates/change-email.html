<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email Change - Kpege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #e8f1df;
            border-radius: 8px;
            padding: 40px;
            border: 1px solid #e0e0e0;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-badge {
            display: inline-block;
            color: black;
            padding: 24px 24px;
            border-radius: 8px;
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .content {
            text-align: center;
        }
        .content h2 {
            font-family: 'Montserrat', Arial, sans-serif;
        }
        .button {
            display: inline-block;
            background: #15803d;
            color: white !important;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: 600;
            font-family: 'Open Sans', Arial, sans-serif;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-badge">KPEGE</div>
        </div>
        
        <div class="content">
            <h2>Confirm Email Change</h2>
            <p>Please confirm your new email address by clicking the button below:</p>
            
            <a href="{{.ConfirmationURL}}" class="button">Confirm Email</a>
            
            <p>If you didn't request this change, please contact our support team.</p>
        </div>
        
        <div class="footer">
            <p>© 2024 Kpege. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
