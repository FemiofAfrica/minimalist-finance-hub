<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Kpege</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #e8f1df;
            border-radius: 8px;
            padding: 40px;
            border: 1px solid #e0e0e0;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-badge {
            display: inline-block;
            color: black;
            padding: 24px 24px;
            border-radius: 8px;
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .logo h1 {
            color: #15803d;
            font-size: 32px;
            margin: 0;
            font-weight: bold;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        .tagline {
            color: #666;
            font-size: 14px;
            margin: 5px 0 0 0;
        }
        h2 {
            color: #333;
            font-size: 24px;
            margin: 0 0 20px 0;
            text-align: center;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        p {
            color: #666;
            font-size: 16px;
            margin: 0 0 25px 0;
            text-align: center;
        }
        .button {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 14px 20px;
            background-color: #15803d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-family: 'Open Sans', Arial, sans-serif;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .footer a {
            color: #15803d;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-badge">KPEGE</div>
        </div>
        
        <h2>Welcome! 🎉</h2>
        
        <p>Thanks for signing up. Click the button below to confirm your email and start managing your finances.</p>
        
        <a href="{{.ConfirmationURL}}" class="button">Confirm Email</a>
        
        <p style="font-size: 14px; color: #999;">This link expires in 24 hours. If you didn't sign up for Kpege, you can safely ignore this email.</p>
        
        <div class="footer">
            <p>Need help? <a href="mailto:hello@kpege.com">Contact support</a></p>
        </div>
    </div>
</body>
</html>
