<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix VAPID Registration</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        .button:hover {
            background: #059669;
        }
        .output {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 15px;
            margin: 20px 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
        }
    </style>
</head>
<body>
    <h1>🔧 Fix VAPID Registration</h1>
    
    <div class="status">
        <strong>Issue:</strong> Push notifications are failing because the browser was registered with a different VAPID key than what the server is using.
    </div>

    <div>
        <button class="button" onclick="forceReRegistration()">Fix Push Registration</button>
    </div>

    <div id="output" class="output">Click "Fix Push Registration" to re-register with the correct VAPID key...\n</div>

    <script>
        const output = document.getElementById('output')
        
        function log(message) {
            output.textContent += message + '\n'
            output.scrollTop = output.scrollHeight
        }
        
        window.forceReRegistration = async function() {
            try {
                log('🔄 Starting VAPID key fix...')
                
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                    log('❌ Push messaging not supported')
                    return
                }
                
                const vapidKey = 'VghDQ2d859WAGmaXLQaC9oAP9nqLwrrUUKT_sO2kYk8k5Mqj9T1kedmhKbGSTxyexMAKJaiDNWc6lX9PmvzEaA'
                
                // Get service worker
                let registration = await navigator.serviceWorker.getRegistration()
                if (!registration) {
                    log('📝 Registering service worker...')
                    registration = await navigator.serviceWorker.register('/sw.js')
                    await navigator.serviceWorker.ready
                }
                log('✅ Service worker ready')
                
                // Remove old subscription
                const existingSubscription = await registration.pushManager.getSubscription()
                if (existingSubscription) {
                    log('🔄 Removing old subscription...')
                    await existingSubscription.unsubscribe()
                    log('✅ Old subscription removed')
                }
                
                // Request permission
                const permission = await Notification.requestPermission()
                if (permission !== 'granted') {
                    log('❌ Permission denied: ' + permission)
                    return
                }
                log('✅ Permission granted')
                
                // Convert VAPID key
                function urlBase64ToUint8Array(base64String) {
                    const padding = '='.repeat((4 - base64String.length % 4) % 4)
                    const base64 = (base64String + padding)
                        .replace(/-/g, '+').replace(/_/g, '/')
                    const rawData = window.atob(base64)
                    const outputArray = new Uint8Array(rawData.length)
                    for (let i = 0; i < rawData.length; ++i) {
                        outputArray[i] = rawData.charCodeAt(i)
                    }
                    return outputArray
                }
                
                // Create new subscription
                log('🔑 Creating subscription with correct VAPID key...')
                const newSubscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(vapidKey)
                })
                
                log('✅ New subscription created!')
                log('📍 Endpoint: ' + newSubscription.endpoint.substring(0, 60) + '...')
                log('🎉 VAPID key fix complete!')
                log('')
                log('Now refresh your app and try sending push notifications again.')
                
            } catch (error) {
                log('❌ Error: ' + error.message)
                console.error('Error:', error)
            }
        }
    </script>
</body>
</html>
