    <!-- Immediate URL capture script - runs before React -->
    <script>
      (function() {
        // Only capture for reset-password page
        if (window.location.pathname === '/reset-password') {
          const urlData = {
            href: window.location.href,
            hash: window.location.hash,
            search: window.location.search,
            pathname: window.location.pathname,
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            referrer: document.referrer
          };
          
          console.log('[URL CAPTURE] Immediate page load URL capture:', urlData);
          
          // Store in localStorage for later retrieval
          try {
            localStorage.setItem('kpege_page_load_url', JSON.stringify(urlData));
          } catch (e) {
            console.warn('[URL CAPTURE] Could not store page load URL:', e);
          }
        }
      })();
    </script>
