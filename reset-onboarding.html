<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Onboarding State</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    h1 {
      color: #004D40;
      margin-top: 0;
    }
    p {
      margin-bottom: 20px;
      line-height: 1.5;
    }
    button {
      background-color: #004D40;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #00695C;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
      display: none;
    }
    .status.success {
      display: block;
      background-color: #e6f7e6;
      color: #2e7d32;
    }
    .status.error {
      display: block;
      background-color: #fde8e8;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reset Onboarding State</h1>
    <p>Click the button below to reset the onboarding state for your SayFin account. After resetting, you will see the onboarding process again when you next log in.</p>
    <button id="resetButton">Reset Onboarding State</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    document.getElementById('resetButton').addEventListener('click', function() {
      const statusEl = document.getElementById('status');
      
      try {
        // Get all keys in localStorage
        const keys = Object.keys(localStorage);
        
        // Filter for onboarding keys
        const onboardingKeys = keys.filter(key => key.startsWith('onboarding-completed-'));
        
        if (onboardingKeys.length > 0) {
          // Remove each key
          onboardingKeys.forEach(key => {
            localStorage.removeItem(key);
          });
          
          statusEl.textContent = `Success! ${onboardingKeys.length} onboarding states have been reset. You can now return to the app and refresh the page to see the onboarding flow.`;
          statusEl.className = 'status success';
        } else {
          statusEl.textContent = 'No onboarding states found in localStorage. Are you logged in to the application?';
          statusEl.className = 'status error';
        }
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.className = 'status error';
      }
    });
  </script>
</body>
</html>
